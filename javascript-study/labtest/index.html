<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Creature Battle Arena</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Creature Battle Arena</h1>
    <button id="battleBtn">Start Random Battle</button>
    <button id="resetBtn">Reset Game</button>
    <br>
    <span id="totalLeft">Creatures Left: 0</span>

    <div class="container" id="creatureContainer"></div>

    <div id="log-container">
        <h2>Battle History</h2>
        <ul id="battleLog"></ul>
    </div>

    <!-- JS -->
    <script src="script.js"></script>
</body>
</html>

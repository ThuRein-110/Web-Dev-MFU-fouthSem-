<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset List</title>
  <link rel="stylesheet" href="/public/css/style05a.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="top-bar">
    <h3>Asset List</h3>
    <div>
      <button class="qr-btn" onclick="showSelected()">QR code</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th><input type="checkbox" id="selectAll"></th>
          <th>ID</th>
          <th>Name</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="assetTable"></tbody>
    </table>
  </div>

  <div class="selected-output" id="output"></div>

  <script src="/public/javascript/assetsA.js"></script>
</body>
</html>
